name: Build Twitch Farming

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Twitch Farming/**"
      - ".github/workflows/build-twitch-exe.yml"
      - ".github/scripts/startup-smoke-test.cjs"
      - ".github/scripts/startup-smoke-test.cjs"
      - ".github/scripts/drops-watch-selection-test.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "Twitch Farming/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "Twitch Farming/requirements.txt"

      - name: Generate application version
        shell: pwsh
        run: |
          $version = "1.0.$env:GITHUB_RUN_NUMBER"
          "APP_VERSION = `"$version`"" | Set-Content -Path "Twitch Farming/version_info.py" -Encoding utf8
          $uiBuildInfo = @{ version = $version; build = [int]$env:GITHUB_RUN_NUMBER }
          $uiBuildInfo | ConvertTo-Json -Compress | Set-Content -Path "Twitch Farming/ui/build_info.json" -Encoding utf8
          $indexPath = "Twitch Farming/ui/index.html"
          $html = Get-Content -Path $indexPath -Raw
          $html = [regex]::Replace($html, 'href="style\.css(?:\?v=[^"]*)?"', ('href="style.css?v=' + $version + '"'))
          $html = [regex]::Replace($html, 'src="app\.js(?:\?v=[^"]*)?"', ('src="app.js?v=' + $version + '"'))
          Set-Content -Path $indexPath -Value $html -Encoding utf8 -NoNewline
          Write-Host "Building Twitch Farming v$version"

      - name: Create Twitch application icon
        run: |
          python "Twitch Farming/build_icon.py"

      - name: Validate Python and UI files
        shell: pwsh
        run: |
          python -m compileall "Twitch Farming/app.py" "Twitch Farming/webview_app.py" "Twitch Farming/version_info.py" "Twitch Farming/engine"
          if ($LASTEXITCODE -ne 0) { throw "Python compile validation failed." }
          node --check "Twitch Farming/ui/app.js"
          if ($LASTEXITCODE -ne 0) { throw "Frontend JavaScript syntax validation failed." }
          node --check ".github/scripts/startup-smoke-test.cjs"
          if ($LASTEXITCODE -ne 0) { throw "Startup smoke-test syntax validation failed." }
          node ".github/scripts/startup-smoke-test.cjs"
          if ($LASTEXITCODE -ne 0) { throw "Startup smoke tests failed." }
          python ".github/scripts/drops-watch-selection-test.py"
          if ($LASTEXITCODE -ne 0) { throw "Drops watch-selection tests failed." }
          python -c "from pathlib import Path; import json; root=Path('Twitch Farming'); required=[root/'ui/index.html',root/'ui/style.css',root/'ui/app.js',root/'ui/build_info.json']; missing=[str(p) for p in required if not p.is_file()]; assert not missing, 'Missing UI files: '+', '.join(missing); info=json.loads((root/'ui/build_info.json').read_text(encoding='utf-8-sig')); namespace={}; exec((root/'version_info.py').read_text(encoding='utf-8-sig'),namespace); assert info.get('version')==namespace['APP_VERSION'], 'UI bundle version does not match application version'"
          if ($LASTEXITCODE -ne 0) { throw "UI file verification failed." }

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name "Twitch Farming" --icon "Twitch Farming/assets/twitch.ico" --add-data "Twitch Farming/assets/twitch.ico;assets" --add-data "Twitch Farming/ui;ui" --paths "Twitch Farming" --paths "Twitch Farming/engine" --collect-all webview --collect-all clr_loader --collect-all irc --collect-all pystray --collect-submodules TwitchChannelPointsMiner --hidden-import=clr --hidden-import=clr_loader --hidden-import=webview.platforms.winforms --hidden-import=webview.platforms.edgechromium --hidden-import=webview.platforms.webview2core --hidden-import=System.Windows.Forms --hidden-import=System.Drawing --exclude-module PySide6 --exclude-module shiboken6 --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module pandas --exclude-module numpy --exclude-module flask --exclude-module matplotlib --exclude-module scipy "Twitch Farming/webview_app.py"

      - name: Copy versioned frontend beside executable
        shell: pwsh
        run: |
          $source = "Twitch Farming/ui"
          $destination = "dist/Twitch Farming/ui"
          if (Test-Path $destination) { Remove-Item $destination -Recurse -Force }
          Copy-Item -Path $source -Destination $destination -Recurse -Force
          $required = @("index.html", "style.css", "app.js", "build_info.json")
          foreach ($file in $required) {
            if (-not (Test-Path (Join-Path $destination $file))) { throw "Frontend asset missing: $file" }
          }

      - name: Package portable update archive
        run: |
          python -c "from pathlib import Path; import zipfile; root=Path('dist/Twitch Farming'); target=Path('dist/Twitch.Farming.zip'); exe=root/'Twitch Farming.exe'; internal=root/'_internal'; assert exe.is_file(), 'The onedir executable is missing'; assert internal.is_dir(), 'The onedir dependency folder is missing'; archive=zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED,compresslevel=6); [archive.write(file,file.relative_to(root).as_posix()) for file in root.rglob('*') if file.is_file()]; archive.close(); print(f'Portable update archive: {target.stat().st_size:,} bytes')"

      - name: Verify executable icon and onedir archive
        run: |
          python -c "from pathlib import Path; import json,re,pefile,zipfile; root=Path('dist/Twitch Farming'); p=root/'Twitch Farming.exe'; z=Path('dist/Twitch.Farming.zip'); version_source=Path('Twitch Farming/version_info.py').read_text(encoding='utf-8-sig'); version_namespace={}; exec(version_source,version_namespace); version=version_namespace['APP_VERSION']; required=['index.html','style.css','app.js','build_info.json']; ui=root/'ui'; internal_ui=root/'_internal'/'ui'; assert p.is_file() and p.stat().st_size > 1000000, f'Unexpected EXE size: {p.stat().st_size if p.exists() else 0}'; assert (root/'_internal').is_dir(), 'PyInstaller _internal folder is missing'; assert all((ui/name).is_file() for name in required), 'Versioned frontend beside EXE is incomplete'; assert all((internal_ui/name).is_file() for name in required), 'PyInstaller frontend inside _internal is incomplete'; assert json.loads((ui/'build_info.json').read_text(encoding='utf-8-sig'))['version']==version, 'External frontend version does not match EXE'; assert json.loads((internal_ui/'build_info.json').read_text(encoding='utf-8-sig'))['version']==version, 'Internal frontend version does not match EXE'; assert z.is_file() and z.stat().st_size > 8000000, 'Portable update ZIP is missing or too small'; pe=pefile.PE(str(p)); ids={entry.id for entry in pe.DIRECTORY_ENTRY_RESOURCE.entries if entry.id is not None}; assert 14 in ids, 'RT_GROUP_ICON resource is missing'; archive=zipfile.ZipFile(z); names=set(archive.namelist()); assert 'Twitch Farming.exe' in names and all('ui/'+name in names for name in required) and all('_internal/ui/'+name in names for name in required) and any(name.startswith('_internal/') for name in names), 'The update ZIP does not contain both versioned frontend bundles'; print(f'EXE size: {p.stat().st_size:,} bytes; ZIP size: {z.stat().st_size:,} bytes; UI bundle v{version} verified in both locations')"

      - name: Upload portable application artifact
        uses: actions/upload-artifact@v4
        with:
          name: Twitch-Farming-Windows
          path: "dist/Twitch.Farming.zip"
          if-no-files-found: error

      - name: Check latest branch commit
        id: head
        shell: pwsh
        run: |
          $result = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/main" -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json" }
          $isLatest = ($result.sha -eq $env:GITHUB_SHA).ToString().ToLower()
          "is_latest=$isLatest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish executable release
        if: steps.head.outputs.is_latest == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: twitch-farming-build-${{ github.run_number }}
          name: Twitch Farming build ${{ github.run_number }}
          make_latest: true
          draft: false
          prerelease: false
          files: "dist/Twitch.Farming.zip"
          body: |
            Portable Windows build of Twitch Farming (PyWebView/WebView2).
            Download and extract Twitch.Farming.zip, then launch Twitch Farming.exe.
            Microsoft Edge WebView2 Runtime is required.
            This ZIP package is used by the in-app automatic updater.
            Source code and GPL-3.0 license are available in the repository.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
