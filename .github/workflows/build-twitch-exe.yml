name: Build Twitch Farming

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Twitch Farming/**"
      - ".github/workflows/build-twitch-exe.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "Twitch Farming/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "Twitch Farming/requirements.txt"

      - name: Create Twitch application icon
        run: |
          python "Twitch Farming/build_icon.py"

      - name: Validate Python files
        run: |
          python -m compileall "Twitch Farming/app.py" "Twitch Farming/qt_app.py" "Twitch Farming/engine"

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "Twitch Farming" --icon "Twitch Farming/assets/twitch.ico" --add-data "Twitch Farming/assets/twitch.ico;assets" --paths "Twitch Farming/engine" --collect-all PySide6 --collect-all shiboken6 --collect-submodules TwitchChannelPointsMiner "Twitch Farming/app.py"

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Twitch-Farming-Windows
          path: "dist/Twitch Farming.exe"
          if-no-files-found: error

      - name: Check latest branch commit
        id: head
        shell: pwsh
        run: |
          $result = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/main" -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json" }
          $isLatest = ($result.sha -eq $env:GITHUB_SHA).ToString().ToLower()
          "is_latest=$isLatest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish executable release
        if: steps.head.outputs.is_latest == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: twitch-farming-build-${{ github.run_number }}
          name: Twitch Farming build ${{ github.run_number }}
          make_latest: true
          draft: false
          prerelease: false
          files: "dist/Twitch Farming.exe"
          body: |
            Windows build of Twitch Farming (PySide6/Qt6).
            Source code and GPL-3.0 license are available in the repository.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
