name: Build Twitch Farming

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Twitch Farming/**"
      - ".github/workflows/build-twitch-exe.yml"
      - ".github/scripts/qt-smoke-test.py"
      - ".github/scripts/drops-watch-selection-test.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "Twitch Farming/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "Twitch Farming/requirements.txt"
          python -c "from PySide6.QtWidgets import QApplication; from PySide6.QtSvg import QSvgRenderer; print('PySide6-Essentials ready')"

      - name: Generate application version
        shell: pwsh
        run: |
          $version = "1.0.$env:GITHUB_RUN_NUMBER"
          "APP_VERSION = `"$version`"" | Set-Content -Path "Twitch Farming/version_info.py" -Encoding utf8
          Write-Host "Building Twitch Farming v$version"

      - name: Create Twitch application icon
        run: |
          python "Twitch Farming/build_icon.py"

      - name: Validate Python and Qt files
        shell: pwsh
        run: |
          python -m compileall "Twitch Farming/app.py" "Twitch Farming/backend.py" "Twitch Farming/qt_app.py" "Twitch Farming/version_info.py" "Twitch Farming/engine"
          if ($LASTEXITCODE -ne 0) { throw "Python compile validation failed." }
          python ".github/scripts/qt-smoke-test.py"
          if ($LASTEXITCODE -ne 0) { throw "Qt smoke tests failed." }
          python ".github/scripts/drops-watch-selection-test.py"
          if ($LASTEXITCODE -ne 0) { throw "Drops watch-selection tests failed." }
          python -c "import importlib.util; assert importlib.util.find_spec('PySide6') is not None, 'PySide6 is not importable'; assert all(importlib.util.find_spec(name) is None for name in ('webview','clr','pystray')), 'A legacy GUI package is importable'"

      - name: Build native Qt executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name "Twitch Farming" --icon "Twitch Farming/assets/twitch.ico" --add-data "Twitch Farming/assets/twitch.ico;assets" --add-data "Twitch Farming/assets/ui_icons.png;assets" --paths "Twitch Farming" --paths "Twitch Farming/engine" --collect-all irc --collect-submodules TwitchChannelPointsMiner --hidden-import=PySide6.QtCore --hidden-import=PySide6.QtGui --hidden-import=PySide6.QtWidgets --hidden-import=PySide6.QtSvg --exclude-module pywebview --exclude-module webview --exclude-module pythonnet --exclude-module clr --exclude-module clr_loader --exclude-module pystray --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets --exclude-module PySide6.QtWebEngineQuick --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick --exclude-module PySide6.QtSql --exclude-module PySide6.Qt3DCore --exclude-module PySide6.Qt3DRender --exclude-module PySide6.Qt3DAnimation --exclude-module PySide6.Qt3DInput --exclude-module PySide6.Qt3DExtras --exclude-module PySide6.Qt3DLogic --exclude-module PySide6.QtMultimedia --exclude-module PySide6.QtBluetooth --exclude-module PySide6.QtLocation --exclude-module PySide6.QtPositioning --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module pandas --exclude-module numpy --exclude-module flask --exclude-module matplotlib --exclude-module scipy "Twitch Farming/app.py"
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed." }

      - name: Package portable update archive
        run: |
          python -c "from pathlib import Path; import zipfile; root=Path('dist/Twitch Farming'); target=Path('dist/Twitch.Farming.zip'); exe=root/'Twitch Farming.exe'; internal=root/'_internal'; assert exe.is_file(), 'The native executable is missing'; assert internal.is_dir(), 'The onedir dependency folder is missing'; archive=zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED,compresslevel=6); [archive.write(file,file.relative_to(root).as_posix()) for file in root.rglob('*') if file.is_file()]; archive.close(); print(f'Portable update archive: {target.stat().st_size:,} bytes')"

      - name: Verify native executable and archive
        run: |
          python -c "from pathlib import Path; import json,pefile,zipfile; root=Path('dist/Twitch Farming'); p=root/'Twitch Farming.exe'; z=Path('dist/Twitch.Farming.zip'); version_source=Path('Twitch Farming/version_info.py').read_text(encoding='utf-8-sig'); namespace={}; exec(version_source,namespace); version=namespace['APP_VERSION']; assert p.is_file() and p.stat().st_size > 1000000, 'Unexpected executable size'; assert (root/'_internal').is_dir(), 'PyInstaller _internal folder is missing'; assert any((root/'_internal').rglob('ui_icons.png')), 'The UI icon atlas is missing from the Qt bundle'; assert not (root/'ui').exists(), 'Legacy UI directory is still packaged'; assert z.is_file() and z.stat().st_size > 10000000, 'Portable update ZIP is missing or too small'; pe=pefile.PE(str(p)); ids={entry.id for entry in pe.DIRECTORY_ENTRY_RESOURCE.entries if entry.id is not None}; assert 14 in ids, 'RT_GROUP_ICON resource is missing'; archive=zipfile.ZipFile(z); names=set(archive.namelist()); lowered=[name.lower() for name in names]; qt_files=[name for name in sorted(names) if any(marker in name.lower() for marker in ('qtcore','qtgui','qtwidgets','qtsvg','qwindows','shiboken'))]; print('Qt runtime files: ' + repr(qt_files)); assert any('qtcore' in name.lower() and name.lower().endswith('.pyd') for name in names), 'QtCore binding is missing from the archive'; assert any('qtgui' in name.lower() and name.lower().endswith('.pyd') for name in names), 'QtGui binding is missing from the archive'; assert any('qtwidgets' in name.lower() and name.lower().endswith('.pyd') for name in names), 'QtWidgets binding is missing from the archive'; assert any('qtsvg' in name.lower() and name.lower().endswith('.pyd') for name in names), 'QtSvg binding is missing from the archive'; assert any('qwindows' in name.lower() and name.lower().endswith('.dll') for name in names), 'Windows Qt platform plugin is missing from the archive'; assert 'twitch farming.exe' in lowered, 'The archive does not contain the Qt runtime'; assert not any(name.startswith('ui/') for name in lowered), 'The archive contains the legacy HTML/CSS/JS bundle'; assert not any(any(token in name for token in ('pywebview','webview','pythonnet','clr_loader','qtwebengine','qtqml','qtquick','qtsql','qt3d')) for name in lowered), 'A removed WebView/pythonnet or prohibited Qt module remains in the archive'; print(f'Qt executable: {p.stat().st_size:,} bytes; portable ZIP: {z.stat().st_size:,} bytes; version v{version}')"

      - name: Upload portable application artifact
        uses: actions/upload-artifact@v4
        with:
          name: Twitch-Farming-Windows
          path: "dist/Twitch.Farming.zip"
          if-no-files-found: error

      - name: Check latest branch commit
        id: head
        shell: pwsh
        run: |
          $result = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/main" -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json" }
          $isLatest = ($result.sha -eq $env:GITHUB_SHA).ToString().ToLower()
          "is_latest=$isLatest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish executable release
        if: steps.head.outputs.is_latest == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: twitch-farming-build-${{ github.run_number }}
          name: Twitch Farming build ${{ github.run_number }}
          make_latest: true
          draft: false
          prerelease: false
          files: "dist/Twitch.Farming.zip"
          body: |
            Native Windows build of Twitch Farming using PySide6-Essentials (Qt6).
            Download and extract Twitch.Farming.zip, then launch Twitch Farming.exe.
            The package does not use PyWebView, WebView2, or pythonnet.
            Source code and GPL-3.0 license are available in the repository.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
