name: Build Twitch Farming

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Twitch Farming/**"
      - ".github/workflows/build-twitch-exe.yml"
      - ".github/scripts/startup-smoke-test.cjs"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "Twitch Farming/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "Twitch Farming/requirements.txt"

      - name: Create Twitch application icon
        run: |
          python "Twitch Farming/build_icon.py"

      - name: Validate Python and UI files
        run: |
          python -m compileall "Twitch Farming/app.py" "Twitch Farming/webview_app.py" "Twitch Farming/engine"
          node --check "Twitch Farming/ui/app.js"
          node ".github/scripts/startup-smoke-test.cjs"
          python -c "from pathlib import Path; root=Path('Twitch Farming'); required=[root/'ui/index.html',root/'ui/style.css',root/'ui/app.js']; missing=[str(p) for p in required if not p.is_file()]; assert not missing, 'Missing UI files: '+', '.join(missing)"

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "Twitch Farming" --icon "Twitch Farming/assets/twitch.ico" --add-data "Twitch Farming/assets/twitch.ico;assets" --add-data "Twitch Farming/ui;ui" --paths "Twitch Farming/engine" --collect-all webview --collect-all clr_loader --collect-all irc --collect-all pystray --collect-submodules TwitchChannelPointsMiner --hidden-import=clr --hidden-import=clr_loader --hidden-import=webview.platforms.winforms --hidden-import=webview.platforms.edgechromium --hidden-import=webview.platforms.webview2core --hidden-import=System.Windows.Forms --hidden-import=System.Drawing --exclude-module PySide6 --exclude-module shiboken6 --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module pandas --exclude-module numpy --exclude-module flask --exclude-module matplotlib --exclude-module scipy "Twitch Farming/app.py"

      - name: Verify executable icon and onefile archive
        run: |
          python -c "from pathlib import Path; import pefile; p=Path('dist/Twitch Farming.exe'); assert p.is_file() and p.stat().st_size > 8000000, f'Unexpected EXE size: {p.stat().st_size if p.exists() else 0}'; pe=pefile.PE(str(p)); ids={entry.id for entry in pe.DIRECTORY_ENTRY_RESOURCE.entries if entry.id is not None}; assert 14 in ids, 'RT_GROUP_ICON resource is missing'; print(f'EXE size: {p.stat().st_size:,} bytes; icon resource found')"

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Twitch-Farming-Windows
          path: "dist/Twitch Farming.exe"
          if-no-files-found: error

      - name: Check latest branch commit
        id: head
        shell: pwsh
        run: |
          $result = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/main" -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json" }
          $isLatest = ($result.sha -eq $env:GITHUB_SHA).ToString().ToLower()
          "is_latest=$isLatest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish executable release
        if: steps.head.outputs.is_latest == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: twitch-farming-build-${{ github.run_number }}
          name: Twitch Farming build ${{ github.run_number }}
          make_latest: true
          draft: false
          prerelease: false
          files: "dist/Twitch Farming.exe"
          body: |
            Windows build of Twitch Farming (PyWebView/WebView2).
            Microsoft Edge WebView2 Runtime is required.
            Source code and GPL-3.0 license are available in the repository.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
