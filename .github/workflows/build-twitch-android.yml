name: Build Twitch Farming Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Twitch Farming/android/**"
      - "Twitch Farming/backend.py"
      - "Twitch Farming/engine/**"
      - "Twitch Farming/i18n.py"
      - "Twitch Farming/locales/**"
      - ".github/workflows/build-twitch-android.yml"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
            libltdl-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
            libsdl2-ttf-dev libmtdev-dev libgles2-mesa-dev xclip xsel
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade buildozer cython==0.29.36

      - name: Prepare shared Twitch engine
        working-directory: Twitch Farming/android
        run: bash prepare.sh

      - name: Build ARMv7 APK
        working-directory: Twitch Farming/android
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: buildozer -v android debug

      - name: Verify APK ABI and manifest
        working-directory: Twitch Farming/android
        run: |
          APK=$(find bin -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          mkdir -p ../../artifacts
          cp "$APK" ../../artifacts/Twitch-Farming-Android-armeabi-v7a.apk
          $ANDROID_HOME/build-tools/33.0.2/aapt dump badging "$APK" | tee ../../artifacts/apk-badging.txt
          grep -q "sdkVersion:'29'" ../../artifacts/apk-badging.txt
          unzip -Z1 "$APK" | grep -q 'lib/armeabi-v7a/'
          if unzip -Z1 "$APK" | grep -q 'lib/arm64-v8a/'; then
            echo "Unexpected 64-bit native libraries in the Redmi 7A APK."
            exit 1
          fi
          sha256sum ../../artifacts/Twitch-Farming-Android-armeabi-v7a.apk > ../../artifacts/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Twitch-Farming-Android-armeabi-v7a
          path: artifacts/Twitch-Farming-Android-armeabi-v7a.apk
          if-no-files-found: error

      - name: Publish Android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: twitch-farming-android-\${{ github.run_number }}
          name: Twitch Farming Android build \${{ github.run_number }}
          draft: false
          prerelease: true
          files: |
            artifacts/Twitch-Farming-Android-armeabi-v7a.apk
            artifacts/SHA256SUMS.txt
          body: |
            Android APK for Xiaomi Redmi 7A (Android 10, armeabi-v7a / 32-bit).
            This is a separate Android port that shares the existing Twitch backend and miner engine.
            Install the APK, sign in with Twitch, and allow the ongoing foreground-service notification.
