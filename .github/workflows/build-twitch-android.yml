name: Build Twitch Farming Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Twitch Farming/android/**"
      - "Twitch Farming/backend.py"
      - "Twitch Farming/engine/**"
      - "Twitch Farming/i18n.py"
      - "Twitch Farming/locales/**"
      - ".github/workflows/build-twitch-android.yml"

permissions:
  actions: read
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
            libltdl-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
            libsdl2-ttf-dev libmtdev-dev libgles2-mesa-dev xclip xsel
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade buildozer cython==0.29.36

      - name: Prepare shared Twitch engine
        working-directory: Twitch Farming/android
        run: bash prepare.sh

      - name: Install desktop Kivy for phone-size screenshots
        run: |
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install "kivy==2.3.1" Pillow

      - name: Generate Android app icons
        working-directory: Twitch Farming/android
        run: python generate_assets.py

      - name: Compile Android Python sources
        working-directory: Twitch Farming/android
        run: python -m py_compile main.py service.py android_diagnostics.py generate_assets.py

      - name: Capture phone-size UI screenshots
        working-directory: Twitch Farming/android
        env:
          KIVY_NO_ARGS: "1"
          SDL_AUDIODRIVER: dummy
          TWITCH_MOBILE_SCREENSHOT_DIR: screenshots
          TWITCH_FARMING_LOG_DIR: /tmp/twitch-farming-preview-diagnostics
        run: |
          mkdir -p ../../artifacts
          xvfb-run -a python main.py --preview
          test -s /tmp/twitch-farming-preview-diagnostics/twitch-farming-android.log
          grep -q "APP_BUILD_OK" /tmp/twitch-farming-preview-diagnostics/twitch-farming-android.log
          grep -q "UI_ENTRYPOINT" /tmp/twitch-farming-preview-diagnostics/twitch-farming-android.log
          python -c "from pathlib import Path; from PIL import Image, ImageChops; files=list(Path('screenshots').glob('*.png')); assert len(files)==6, f'Expected 6 screen captures, got {len(files)}'; names={p.name.split('0')[0] for p in files}; assert len(names)>=6, f'Some mobile sections were not captured: {names}'; a=Image.open(next(p for p in files if p.name.startswith('channels'))).convert('RGB'); b=Image.open(next(p for p in files if p.name.startswith('drops'))).convert('RGB'); assert ImageChops.difference(a,b).getbbox(), 'Drops screenshot is a duplicate of Channels'; print('\n'.join(str(p) for p in files))"
          python -c "import zipfile; from pathlib import Path; z=zipfile.ZipFile('../../artifacts/Twitch-Farming-Android-Screenshots.zip','w',zipfile.ZIP_DEFLATED); [z.write(p,p.name) for p in Path('screenshots').glob('*.png')]; z.close()"

      - name: Upload phone UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Twitch-Farming-Android-Screenshots
          path: artifacts/Twitch-Farming-Android-Screenshots.zip
          if-no-files-found: error

      - name: Build ARMv7 APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          BUILD_DIR="$RUNNER_TEMP/twitch-farming-android"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          cp -a "Twitch Farming/android/." "$BUILD_DIR/"
          cd "$BUILD_DIR"
          buildozer -v android debug

      - name: Verify APK ABI and manifest
        run: |
          BUILD_DIR="$RUNNER_TEMP/twitch-farming-android"
          APK=$(find "$BUILD_DIR/bin" -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$APK" "$GITHUB_WORKSPACE/artifacts/Twitch-Farming-Android-armeabi-v7a.apk"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee "$GITHUB_WORKSPACE/artifacts/apk-badging.txt"
          grep -q "sdkVersion:'21'" "$GITHUB_WORKSPACE/artifacts/apk-badging.txt"
          unzip -Z1 "$APK" | grep -q 'lib/armeabi-v7a/'
          if unzip -Z1 "$APK" | grep -q 'lib/arm64-v8a/'; then
            echo "Unexpected 64-bit native libraries in the Redmi 7A APK."
            exit 1
          fi
          sha256sum "$GITHUB_WORKSPACE/artifacts/Twitch-Farming-Android-armeabi-v7a.apk" > "$GITHUB_WORKSPACE/artifacts/SHA256SUMS.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Twitch-Farming-Android-armeabi-v7a
          path: artifacts/Twitch-Farming-Android-armeabi-v7a.apk
          if-no-files-found: error

      - name: Find matching Windows release
        id: desktop_release
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const workflowId = "build-twitch-exe.yml"
            let desktopRun = null

            for (let attempt = 0; attempt < 40; attempt += 1) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                head_sha: context.sha,
                per_page: 10,
              })
              desktopRun = response.data.workflow_runs.find(run => run.head_sha === context.sha) || null

              if (desktopRun && desktopRun.status === "completed") {
                if (desktopRun.conclusion !== "success") {
                  throw new Error(`Matching Windows build failed: ${desktopRun.html_url}`)
                }
                break
              }

              await new Promise(resolve => setTimeout(resolve, 15000))
            }

            if (!desktopRun || desktopRun.status !== "completed" || desktopRun.conclusion !== "success") {
              throw new Error("No successful Windows build was found for this exact source commit.")
            }

            const tag = `twitch-farming-build-${desktopRun.run_number}`
            await github.rest.repos.getReleaseByTag({ owner, repo, tag })
            core.setOutput("tag", tag)
            core.setOutput("run_number", String(desktopRun.run_number))

      - name: Publish Android APK alongside Windows ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.desktop_release.outputs.tag }}
          name: Twitch Farming build ${{ steps.desktop_release.outputs.run_number }}
          draft: false
          prerelease: false
          files: |
            artifacts/Twitch-Farming-Android-armeabi-v7a.apk
            artifacts/Twitch-Farming-Android-Screenshots.zip
            artifacts/SHA256SUMS.txt
