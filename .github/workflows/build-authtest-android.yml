name: Build Twitch Auth Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "AuthTest/**"
      - ".github/workflows/build-authtest-android.yml"

permissions:
  contents: read

jobs:
  build-authtest-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache AuthTest Android toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cache/pip
          key: authtest-buildozer-\${{ runner.os }}-py311-\${{ hashFiles('AuthTest/buildozer.spec') }}
          restore-keys: |
            authtest-buildozer-\${{ runner.os }}-py311-

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
            libltdl-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
            libsdl2-ttf-dev libmtdev-dev libgles2-mesa-dev
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade buildozer cython==0.29.36 Pillow

      - name: Generate application icons
        working-directory: AuthTest
        run: python generate_assets.py

      - name: Compile Python sources
        working-directory: AuthTest
        run: python -m py_compile main.py service.py generate_assets.py

      - name: Build ARMv7 APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          BUILD_DIR="$RUNNER_TEMP/twitch-auth-test"
          mkdir -p "$BUILD_DIR"
          cp -a "AuthTest/." "$BUILD_DIR/"
          cd "$BUILD_DIR"
          buildozer -v android debug

      - name: Verify APK ABI and package
        run: |
          BUILD_DIR="$RUNNER_TEMP/twitch-auth-test"
          APK=$(find "$BUILD_DIR/bin" -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$APK" "$GITHUB_WORKSPACE/artifacts/Twitch-Auth-Test-Android-armeabi-v7a.apk"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee "$GITHUB_WORKSPACE/artifacts/apk-badging.txt"
          grep -q "package: name='org.gamooda.twitchauthtest'" "$GITHUB_WORKSPACE/artifacts/apk-badging.txt"
          grep -q "sdkVersion:'21'" "$GITHUB_WORKSPACE/artifacts/apk-badging.txt"
          unzip -Z1 "$APK" | grep -q 'lib/armeabi-v7a/'
          if unzip -Z1 "$APK" | grep -q 'lib/arm64-v8a/'; then
            echo "Unexpected 64-bit native libraries in the ARMv7 AuthTest APK."
            exit 1
          fi
          sha256sum "$GITHUB_WORKSPACE/artifacts/Twitch-Auth-Test-Android-armeabi-v7a.apk" > "$GITHUB_WORKSPACE/artifacts/SHA256SUMS.txt"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Twitch-Auth-Test-Android-armeabi-v7a
          path: |
            artifacts/Twitch-Auth-Test-Android-armeabi-v7a.apk
            artifacts/apk-badging.txt
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
